name: Backend CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hrm_dev
          POSTGRES_USER: hrm_app
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hrm_app -d hrm_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5433/hrm_dev
      DB_USERNAME: hrm_app
      DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run tests
        run: mvn -B verify
