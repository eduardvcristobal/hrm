spring:
  application:
    name: hrm-saas
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hrm_dev}
    username: ${DB_USERNAME:hrm_app}
    password: ${DB_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hrm:
  invitation:
    from: ${INVITATION_FROM:}
    accept-url: ${INVITATION_ACCEPT_URL:}
  password-reset:
    url: ${PASSWORD_RESET_URL:}
