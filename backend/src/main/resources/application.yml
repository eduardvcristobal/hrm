spring:
  application:
    name: hrm-saas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hrm_dev}
    username: ${DB_USERNAME:hrm_app}
    password: ${DB_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
