spring:
  application:
    name: hrm-saas
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hrm_dev}
    username: ${DB_USERNAME:hrm_app}
    password: ${DB_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${BACKUP_UPLOAD_MAX_FILE_SIZE:2GB}
      max-request-size: ${BACKUP_UPLOAD_MAX_REQUEST_SIZE:2GB}
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hrm:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
  platform-admin:
    emails: ${PLATFORM_ADMIN_EMAILS:}
  invitation:
    from: ${INVITATION_FROM:}
    accept-url: ${INVITATION_ACCEPT_URL:}
  password-reset:
    url: ${PASSWORD_RESET_URL:}
app:
  backup:
    age-recipient: ${APP_BACKUP_AGE_RECIPIENT:}
    age-identity: ${APP_BACKUP_AGE_IDENTITY:}
    directory: ${APP_BACKUP_DIRECTORY:./data/backups}
    database-url: ${APP_BACKUP_DB_URL:}
    database-username: ${APP_BACKUP_DB_USERNAME:}
    database-password: ${APP_BACKUP_DB_PASSWORD:}
